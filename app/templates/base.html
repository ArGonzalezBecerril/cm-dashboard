<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cloudera Manager Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='gsap.min.js') }}"></script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <div class="brand">
                <div class="pulse"></div>
                <div>CLOUDERA <span>API MONITOR</span></div>
            </div>
            <div class="cm-dropdown" id="cm-aws-user-dropdown" style="position:relative;display:inline-block;">
            <button type="button" id="btn-aws-user" class="cm-dropdown-trigger" onclick="toggleAwsUserMenu(event)" style="border-color:rgba(161,161,170,0.35)!important;color:#f4f4f5!important;">
                <span style="color:#22d3ee;">●</span>
                <span id="aws-user-label">{{ session.get('cm_user') or session.get('username') or 'Admin CM' }}</span>
                <span id="aws-user-caret" style="display:inline-block;margin-left:4px;font-size:0.72rem;color:#a1a1aa;">▼</span>
            </button>
            <div id="cm-aws-user-menu" class="cm-dropdown-panel" style="display:none;left:auto;right:0;min-width:250px;transform-origin:top right;">
                <button type="button" class="cm-dropdown-item" onclick="closeAwsUserMenu(); openUserDetailPopup();">
                    <span class="cm-item-icon">👤</span>
                    <div class="cm-item-text">
                        <strong>Detalle Usuario</strong>
                        <small>Sesión activa y conexión Cloudera</small>
                    </div>
                </button>
                <div class="cm-dropdown-divider"></div>
                <a href="/logout" class="cm-dropdown-item" style="text-decoration:none;">
                    <span class="cm-item-icon" style="color:#fb7185;border-color:rgba(244,63,94,0.3);">⏻</span>
                    <div class="cm-item-text">
                        <strong style="color:#fb7185;">Cerrar Sessión</strong>
                        <small>Finalizar sesión y limpiar caché</small>
                    </div>
                </a>
            </div>
        </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="footer-inner">
            <span>Cloudera Manager REST Monitor • Modo Operaciones</span>
            <span id="footer-slot">Listo</span>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='actions.js') }}"></script>
</body>
</html>
