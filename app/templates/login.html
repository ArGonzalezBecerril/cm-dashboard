<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso • Cloudera API Monitor</title>
    <style>
        :root { --bg-void: #06070a; --glass-bg: rgba(15, 17, 23, 0.62); --glass-border: rgba(255, 255, 255, 0.08); --cyan: #22d3ee; --cyan-dark: #06b6d4; --emerald: #10b981; --text-main: #f4f4f5; --text-muted: #a1a1aa; --text-dim: #71717a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background-color: var(--bg-void); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; display: flex; align-items: center; justify-content: center; padding: 1.5rem; overflow: hidden; position: relative; }
        .ambient-orb { position: absolute; border-radius: 50%; filter: blur(110px); z-index: 0; pointer-events: none; animation: floatOrb 14s ease-in-out infinite alternate; }
        .orb-1 { width: 420px; height: 420px; background: rgba(6, 182, 212, 0.18); top: -10%; left: 15%; }
        .orb-2 { width: 380px; height: 380px; background: rgba(16, 185, 129, 0.14); bottom: -12%; right: 15%; animation-delay: -5s; }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px); background-size: 42px 42px; mask-image: radial-gradient(circle at center, black 40%, transparent 85%); z-index: 0; pointer-events: none; }
        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 25px) scale(1.08); } }
        .glass-panel { position: relative; z-index: 1; width: 100%; max-width: 430px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2.2rem 2rem; box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.85), inset 0 1px 0 0 rgba(255, 255, 255, 0.1); }
        .glass-panel::before { content: ""; position: absolute; top: 0; left: 15%; right: 15%; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: 0.75; }
        .brand-header { text-align: center; margin-bottom: 1.8rem; }
        .logo-badge { width: 68px; height: 68px; margin: 0 auto 1rem; border-radius: 18px; background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(16, 185, 129, 0.08)); border: 1px solid rgba(34, 211, 238, 0.3); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(34, 211, 238, 0.15); }
        .brand-header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.4px; color: #fff; }
        .brand-header h1 span { color: var(--cyan); font-weight: 400; }
        .brand-header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
        .error-alert { background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.4); color: #fecdd3; padding: 0.75rem 0.9rem; border-radius: 10px; font-size: 0.8rem; margin-bottom: 1.3rem; display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
        .field-group { margin-bottom: 1.1rem; }
        label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-muted); margin-bottom: 0.45rem; font-weight: 600; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 12px; color: var(--text-dim); pointer-events: none; display: flex; }
        input, select { width: 100%; background: rgba(6, 7, 10, 0.65); border: 1px solid rgba(255, 255, 255, 0.09); color: #fff; padding: 0.72rem 0.9rem 0.72rem 2.45rem; border-radius: 11px; font-size: 0.88rem; outline: none; transition: all 0.2s ease; }
        input.no-icon, select.no-icon { padding-left: 0.85rem; }
        input:focus, select:focus { border-color: var(--cyan); background: rgba(9, 12, 18, 0.9); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.14); }
        .toggle-pwd { position: absolute; right: 10px; background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; display: flex; width: auto; }
        .toggle-pwd:hover { color: var(--cyan); background: transparent; }
        .cluster-cfg { margin-top: 0.8rem; margin-bottom: 1.4rem; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 0.65rem 0.9rem; transition: border-color 0.35s ease, background 0.35s ease; }
        .cluster-cfg.is-open { border-color: rgba(34, 211, 238, 0.28); background: rgba(0, 0, 0, 0.45); }
        .cfg-trigger { font-size: 0.76rem; color: var(--text-muted); cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; }
        .cfg-trigger:hover { color: #f4f4f5; }
        .host-pill { font-family: monospace; color: var(--cyan); background: rgba(34, 211, 238, 0.08); border: 1px solid rgba(34, 211, 238, 0.2); padding: 2px 8px; border-radius: 6px; font-size: 0.72rem; display: inline-flex; align-items: center; gap: 5px; }
        .cfg-chevron { transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1); color: var(--cyan); }
        .cluster-cfg.is-open .cfg-chevron { transform: rotate(180deg); }
        .curtain-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.48s cubic-bezier(0.22, 1, 0.36, 1); }
        .cluster-cfg.is-open .curtain-wrap { grid-template-rows: 1fr; }
        .curtain-inner { overflow: hidden; opacity: 0; transform: translateY(-12px); transition: opacity 0.36s ease, transform 0.48s cubic-bezier(0.22, 1, 0.36, 1); }
        .cluster-cfg.is-open .curtain-inner { opacity: 1; transform: translateY(0); }
        .cfg-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 0.7rem; margin-top: 0.9rem; padding-top: 0.8rem; border-top: 1px solid rgba(255, 255, 255, 0.06); }
        .btn-submit { width: 100%; padding: 0.8rem 1rem; border: none; border-radius: 11px; background: linear-gradient(135deg, var(--cyan), var(--cyan-dark)); color: #05070a; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.3px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px -4px rgba(6, 182, 212, 0.45); transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease; }
        .btn-submit:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 12px 25px -4px rgba(34, 211, 238, 0.55); }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
        .footer-status { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.06); display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-dim); }
        .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); margin-right: 6px; }
    </style>
</head>
<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="bg-grid"></div>
    <div class="glass-panel">
        <div class="brand-header">
            <div class="logo-badge">
                <svg width="48" height="48" viewBox="0 0 120 120" xmlns="http://w3.org">
                    <ellipse cx="60" cy="28" rx="34" ry="18" fill="#3b5b7e"/><path d="M26 28 C26 14, 94 14, 94 28 L88 38 L32 38 Z" fill="#466b94"/><ellipse cx="60" cy="21" rx="5.5" ry="7.5" fill="#facc15" stroke="#eab308" stroke-width="1"/><rect x="33" y="34" width="54" height="10" rx="3" fill="#2c3e55"/><ellipse cx="60" cy="43" rx="26" ry="5" fill="#182232"/><path d="M36 45 L38 60 L41 58 L40 45 Z" fill="#6b4433"/><path d="M84 45 L82 60 L79 58 L80 45 Z" fill="#6b4433"/><ellipse cx="36" cy="62" rx="4" ry="7" fill="#f5d0a9"/><ellipse cx="84" cy="62" rx="4" ry="7" fill="#f5d0a9"/><path d="M40 45 L80 45 L78 68 C78 78, 42 78, 42 68 Z" fill="#fde0bd"/><path d="M48 74 L72 74 L74 88 L60 98 L46 88 Z" fill="#f3c697"/><path d="M18 114 C18 94, 32 88, 46 86 L60 99 L74 86 C88 88, 102 94, 102 114 Z" fill="#3b5b7e"/><polygon points="46,85 60,99 51,105 40,91" fill="#2f4a68"/><polygon points="74,85 60,99 69,105 80,91" fill="#2f4a68"/><polygon points="56,97 64,97 62,102 58,102" fill="#182232"/><polygon points="58,102 62,102 64,114 56,114" fill="#1e293b"/><rect x="27" y="106" width="21" height="8" rx="1.5" fill="#2f4a68"/><rect x="72" y="106" width="22" height="8" rx="1.5" fill="#2f4a68"/><path d="M83 93 L89 95.2 V99.5 C89 102.2 83 104.2 83 104.2 C83 104.2 77 102.2 77 99.5 V95.2 Z" fill="#182232" stroke="#facc15" stroke-width="1.2"/><text x="83" y="100.3" font-family="Arial, sans-serif" font-weight="900" font-size="3.9" fill="#facc15" text-anchor="middle" letter-spacing="0.2">CDMX</text>
                </svg>
            </div>
            <h1>CLOUDERA <span>API MONITOR</span></h1>
            <p>Autenticación directa contra Cloudera Manager</p>
        </div>
        {% if error %}
        <div class="error-alert"><span>{{ error }}</span></div>
        {% endif %}
        <form method="POST" action="{{ url_for('auth.login') }}" id="login-form">
            <div class="field-group">
                <label for="user">Usuario Cloudera</label>
                <div class="input-wrap">
                    <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
                    <input type="text" id="user" name="user" value="{{ form.user }}" required autocomplete="username" placeholder="admin">
                </div>
            </div>
            <div class="field-group">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••" autofocus>
                    <button type="button" class="toggle-pwd" onclick="togglePassword()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
                </div>
            </div>
            <div class="cluster-cfg" id="cluster-cfg-box">
                <div class="cfg-trigger" onclick="toggleClusterCurtain()">
                    <span>Servidor Cloudera Manager</span>
                    <span class="host-pill">
                        <span id="preview-host">{{ form.protocol }}://{{ form.host }}:{{ form.port }}</span>
                        <svg class="cfg-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </span>
                </div>
                <div class="curtain-wrap">
                    <div class="curtain-inner">
                        <div class="cfg-grid">
                            <div><label for="host">Host / IP Master</label><input type="text" id="host" name="host" class="no-icon" value="{{ form.host }}" oninput="updatePreview()"></div>
                            <div><label for="port">Puerto</label><input type="text" id="port" name="port" class="no-icon" value="{{ form.port }}" oninput="updatePreview()"></div>
                            <div><label for="protocol">Protocolo</label><select id="protocol" name="protocol" class="no-icon" onchange="updatePreview()"><option value="http" {% if form.protocol == 'http' %}selected{% endif %}>HTTP</option><option value="https" {% if form.protocol == 'https' %}selected{% endif %}>HTTPS</option></select></div>
                            <div><label for="api_ver">Versión API</label><input type="text" id="api_ver" name="api_ver" class="no-icon" value="{{ form.api_ver }}"></div>
                        </div>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">
                <span id="btn-text">Conectar al Clúster</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
        <div class="footer-status">
            <span><span class="live-dot"></span>Sesión Cifrada AES</span>
            <span>Cloudera REST API</span>
        </div>
    </div>
    <div style="position: fixed; bottom: 18px; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; pointer-events: none;">
        <div style="display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 999px; background: rgba(16, 185, 129, 0.06); border: 1px solid rgba(16, 185, 129, 0.22); backdrop-filter: blur(10px); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.8px; color: #10b981; text-shadow: 0 0 12px rgba(16, 185, 129, 0.35);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"></polygon><circle cx="12" cy="12" r="2.5" fill="#10b981" fill-opacity="0.35"></circle><line x1="12" y1="2" x2="12" y2="9.5"></line><line x1="21" y1="17" x2="14.2" y2="13.2"></line><line x1="3" y1="17" x2="9.8" y2="13.2"></line></svg>
            <span>BIG DATA <span style="color: #34d399; text-shadow: 0 0 8px #10b981;">•</span> SEGURITECH</span>
        </div>
    </div>
    <script>
        function toggleClusterCurtain() { document.getElementById("cluster-cfg-box").classList.toggle("is-open"); }
        function togglePassword() { const pwd = document.getElementById("password"); pwd.type = pwd.type === "password" ? "text" : "password"; }
        function updatePreview() {
            const proto = document.getElementById("protocol").value;
            const host = document.getElementById("host").value || "host";
            const port = document.getElementById("port").value || "7180";
            document.getElementById("preview-host").textContent = `${proto}://${host}:${port}`;
        }
        document.getElementById("login-form").addEventListener("submit", function() {
            document.getElementById("submit-btn").disabled = true;
            document.getElementById("btn-text").textContent = "Autenticando con Cloudera...";
        });
    </script>
</body>
</html>
